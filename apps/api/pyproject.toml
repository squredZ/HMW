[project]
name = "hmw-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
