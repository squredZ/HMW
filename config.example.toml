# 复制为 .hmw.toml 并填写本地开发账号。该文件仅供本地开发。
[owner]
username = "owner"
password = ""

[server]
api_port = 8000
web_port = 5173

# 启用后会向模型服务发送问题、对话历史和自主读取的项目已发布知识。
# 以下模型和预算是 DeepSeek V4 Pro 的示例；默认不启用模型。
[llm]
enabled = false
api_key = ""
model = "deepseek-v4-pro"
api_url = "https://api.deepseek.com"
reasoning_effort = "off" # off / low / high / max
max_output_tokens = 4096
context_window_tokens = 1048576
max_context_bytes = 200000
max_answer_chars = 12000
timeout_seconds = 180

# direct: Agent 直连；environment: 使用代理环境变量或下面显式配置。
[network]
proxy_mode = "direct"
# http_proxy = "http://proxy.example:3128"
# https_proxy = "http://proxy.example:3128"
# no_proxy = "localhost,127.0.0.1,.corp.example"
# ca_file = "/path/to/company-ca.pem"
